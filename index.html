<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9b3f2a">
<title>城西尋影｜歷史尋跡地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
<style>
:root{
  --red:#9c402c;
  --red-dark:#7c2f1e;
  --cream:#f7f0e7;
  --paper:#fffaf3;
  --beige:#ead8c4;
  --beige-2:#f1e5d6;
  --ink:#3d3028;
  --muted:#78695f;
  --line:#d3c0aa;
  --green:#5d8464;
  --blue:#98b7df;
  --pink:#f0c8c8;
  --apricot:#f3d5b7;
  --shadow:0 10px 24px rgba(61,38,20,.10);
  --font:'Noto Sans TC', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e8dccd;color:var(--ink);font-family:var(--font)}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--cream);box-shadow:0 0 30px rgba(0,0,0,.08);position:relative;overflow:hidden}
.topbar{background:linear-gradient(180deg,#a44430,#933a29);color:#fff;padding:18px 18px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.brand-wrap{display:flex;gap:12px;align-items:flex-start}
.brand-mark{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,245,235,.8);position:relative;flex:none;margin-top:2px}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff6ec}
.brand-mark:before{width:20px;height:2px}
.brand-mark:after{width:2px;height:20px}
.brand-mark i,.brand-mark b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);display:block;background:#fff6ec}
.brand-mark i{width:20px;height:2px}.brand-mark b{width:2px;height:20px}
.brand h1{margin:0;font-size:26px;line-height:1.05;font-weight:900;letter-spacing:.08em}
.brand p{margin:6px 0 0;color:#f4d6c8;font-size:12px;letter-spacing:.20em;font-weight:500}
.passport-btn{border:1.5px solid rgba(255,236,226,.75);background:transparent;color:#fff7f0;border-radius:14px;padding:10px 12px;min-width:104px;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.passport-btn .label{display:block;font-size:13px;font-weight:700;letter-spacing:.06em}.passport-btn .score{display:block;margin-top:3px;font-size:15px;font-weight:800}
.section{padding:18px}
.timeline-block{padding:16px 18px 14px;border-bottom:1px solid #eadbcb}
.timeline-title{font-size:14px;font-weight:900;color:var(--red);letter-spacing:.14em;margin:0 0 14px}
.periods{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;margin-bottom:12px}.period{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;letter-spacing:.06em}.p1{background:var(--apricot)}.p2{background:var(--pink)}.p3{background:var(--blue)}
.years{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:0 8px 2px;margin-top:4px}.years:before{content:"";position:absolute;left:16px;right:16px;top:14px;height:3px;background:#af6a4f;border-radius:6px}.year{position:relative;z-index:1;background:transparent;border:0;padding:0;width:56px;text-align:center;color:#5c4036}.year .dot{display:block;width:24px;height:24px;margin:2px auto 10px;border-radius:50%;border:4px solid #b56a4b;background:#fff6ee;box-shadow:0 0 0 5px var(--cream)}.year span{display:block;font-size:14px;font-weight:900;letter-spacing:.02em}.year.active .dot{background:var(--red);border-color:var(--red)}.year.active span{color:var(--red)}
.map-section{padding:18px}.map-card{background:#fff9f0;border:1px solid #dcc9b2;border-radius:28px;box-shadow:var(--shadow);padding:14px}.map-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.map-head h2{margin:0;font-size:22px;line-height:1.15;font-weight:900;letter-spacing:.02em}.map-head p{margin:8px 0 0;font-size:13px;line-height:1.7;color:var(--muted)}.locate-btn{border:2px solid #c3a688;background:#fffaf4;color:var(--red);border-radius:999px;padding:11px 16px;font-size:15px;font-weight:700;line-height:1.3;min-width:112px;flex:none}
.map-box{border:1px solid #dcc9b2;border-radius:22px;overflow:hidden;position:relative;height:500px;background:#ebe2d4}.map-box:before{content:"";position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);pointer-events:none;z-index:500}.map-area{height:100%;width:100%}
.leaflet-container{font-family:var(--font);background:#ece2d4}.leaflet-pane.leaflet-tile-pane,.leaflet-pane.leaflet-shadow-pane,.leaflet-pane.leaflet-overlay-pane{filter:saturate(.70) brightness(1.03)}.leaflet-control-zoom{border:none!important;box-shadow:0 8px 18px rgba(50,28,11,.18)!important;margin:14px 0 0 14px!important}.leaflet-control-zoom a{width:46px!important;height:46px!important;line-height:44px!important;border:none!important;background:#fff!important;color:var(--red)!important;font-size:32px;font-weight:800}.leaflet-control-zoom a:first-child{border-radius:14px 14px 0 0}.leaflet-control-zoom a:last-child{border-radius:0 0 14px 14px;border-top:1px solid #eadccb!important}
.leaflet-top,.leaflet-bottom{z-index:400!important}
.legend-note{padding:10px 4px 0;color:var(--muted);font-size:13px;line-height:1.6}
.photo-pin{width:46px;height:60px;position:relative}.photo-pin .ring{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;overflow:hidden;background:#f5e9d7;border:3px solid #fef7ef;box-shadow:0 2px 8px rgba(41,26,13,.28)}.photo-pin .ring img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.12)}.photo-pin .ring.fallback{display:grid;place-items:center;font-size:13px;font-weight:800;color:#8c5b41}.photo-pin:after{content:"";position:absolute;left:15px;top:33px;width:16px;height:24px;background:#8f462d;clip-path:polygon(50% 100%,0 20%,100% 20%)}.photo-pin .check{position:absolute;right:-1px;top:-3px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid #fef7ef;box-shadow:0 2px 5px rgba(0,0,0,.18)}.photo-pin.active .ring{outline:3px solid #ffddb9}
.sheet-backdrop{position:fixed;inset:0;background:rgba(31,22,17,.28);z-index:1000;opacity:0;pointer-events:none;transition:.2s}.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:0;width:min(480px,100vw);background:#fff9f1;border-radius:26px 26px 0 0;border:1px solid #dbc9b1;box-shadow:0 -14px 28px rgba(34,20,12,.18);z-index:1100;transition:.25s ease;max-height:78dvh;display:flex;flex-direction:column}.sheet.open{transform:translateX(-50%) translateY(0)}.sheet-handle{width:58px;height:6px;border-radius:8px;background:#cdb79c;margin:12px auto 8px}.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 18px 10px}.sheet-head small{display:block;color:var(--red);font-size:13px;font-weight:700;letter-spacing:.08em;margin-bottom:6px}.sheet-head h3{margin:0;font-size:34px;line-height:1.05;font-weight:900;letter-spacing:.04em}.close-btn{width:54px;height:54px;border-radius:50%;border:2px solid #d9c8af;background:#fffaf4;color:var(--red);font-size:28px;line-height:1;flex:none}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 14px}.qbtn{min-height:56px;border-radius:14px;font-size:20px;font-weight:900;letter-spacing:.03em}.qbtn.primary{background:var(--red);color:#fff;border:1px solid var(--red)}.qbtn.secondary{background:#fffaf1;color:#6b4939;border:2px solid #d7c1a7}
.sheet-scroll{overflow:auto;padding:0 18px 22px}.hero-photo{margin:0;border-radius:12px;overflow:hidden;background:#e9d9c5;border:1px solid #dbc7ab}.hero-photo img{display:block;width:100%;aspect-ratio:1.85;object-fit:cover}.hero-caption{font-size:12px;color:#847467;margin:8px 0 14px}.place-now{font-size:16px;color:#68584b;margin:0 0 10px;font-weight:700}.story{font-size:18px;line-height:1.9;color:#4a3e36;margin:0 0 14px}.status{background:#f7efe3;border:1px solid #e3d2bb;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.7;color:#5c4a3b;margin-bottom:12px}.sheet-links{display:flex;gap:18px;flex-wrap:wrap}.sheet-links a{color:var(--red);font-size:15px;font-weight:700;text-decoration:none;border-bottom:1px solid #cda17b;padding-bottom:2px}
.dialog,.passport-overlay,.video-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:1400;padding:20px;background:rgba(27,18,13,.45)}.dialog.open,.passport-overlay.open,.video-overlay.open{display:flex}.dialog-card,.passport-card{background:#fffaf1;border:1px solid #d8c6b0;border-radius:24px;box-shadow:0 18px 40px rgba(18,9,4,.20);width:min(420px,100%)}.dialog-card{padding:22px 20px}.dialog-card h4{margin:0 0 10px;font-size:28px;color:var(--red);font-weight:900}.dialog-card p{font-size:16px;line-height:1.8;color:#56473a;margin:0}.dialog-actions{display:flex;gap:10px;margin-top:18px}.dialog-actions button{flex:1;min-height:48px;border-radius:12px;font-weight:800}.dialog-actions .yes{background:var(--red);color:#fff;border:1px solid var(--red)}.dialog-actions .no{background:#fffaf1;border:1px solid #ccb597;color:#654c3d}
.passport-card{padding:18px 18px 20px;max-height:84dvh;overflow:auto}.passport-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.passport-head h4{margin:0;font-size:28px;font-weight:900;color:var(--red)}.passport-head p{margin:6px 0 0;font-size:14px;color:var(--muted)}.passport-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.stamp{border:1px dashed #cdb499;border-radius:16px;background:#fffbf4;padding:12px;min-height:116px;position:relative}.stamp small{display:block;font-size:11px;color:#8b7969;letter-spacing:.05em}.stamp strong{display:block;margin-top:6px;font-size:20px;line-height:1.25}.stamp em{display:block;font-style:normal;margin-top:8px;color:#957a64;font-size:13px}.stamp.done:after{content:'尋回';position:absolute;right:10px;bottom:14px;border:2px solid rgba(156,64,44,.78);color:rgba(156,64,44,.82);font-size:22px;font-weight:900;padding:4px 10px;border-radius:50%;transform:rotate(-13deg)}
.video-card{position:relative;width:min(460px,100%)}.video-card video{width:100%;max-height:70dvh;border-radius:16px;background:#000}.video-close{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.4);color:#fff;font-size:24px}
@media (max-width:390px){.brand h1{font-size:23px}.passport-btn{min-width:98px;padding:9px 10px}.period{font-size:16px;height:48px}.sheet-head h3{font-size:30px}.qbtn{font-size:18px}.map-head h2{font-size:20px}.map-box{height:470px}.story{font-size:17px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark"><i></i><b></b></div>
      <div class="brand"><h1>城西尋影</h1><p>OLD TAIPEI・LOST FRAMES</p></div>
    </div>
    <button id="passportBtn" class="passport-btn"><span class="label">集章簿　0／8</span><span class="score">0 分</span></button>
  </header>

  <section class="timeline-block">
    <h2 class="timeline-title">歷史時間軸</h2>
    <div class="periods"><div class="period p1">清代</div><div class="period p2">日治時期</div><div class="period p3">民國時期</div></div>
    <div class="years" id="yearRow"></div>
  </section>

  <section class="map-section">
    <div class="map-card">
      <div class="map-head">
        <div>
          <h2>萬華／城西尋影地圖</h2>
          <p>點圓形老照片即可開啟故事卡。</p>
        </div>
        <button class="locate-btn" id="locateBtn">啟用我的位置</button>
      </div>
      <div class="map-box">
        <div id="map" class="map-area"></div>
      </div>
      <div class="legend-note">已找到的地點會在圖記上打勾；到達現場後按「到點打卡」即可更新集章簿。</div>
    </div>
  </section>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<section class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div>
      <small id="sheetEra">1970年 · 歷史片段 06 / 08</small>
      <h3 id="sheetTitle">中山堂</h3>
    </div>
    <button class="close-btn" id="closeSheet">×</button>
  </div>
  <div class="quick-actions">
    <button class="qbtn primary" id="navBtn">↗ 步行導航</button>
    <button class="qbtn secondary" id="checkBtn">到點打卡</button>
  </div>
  <div class="sheet-scroll">
    <figure class="hero-photo" id="photoBox"></figure>
    <div class="hero-caption" id="photoCaption">臺北市立圖書館數位典藏</div>
    <p class="place-now" id="sheetNow"></p>
    <div class="status" id="sheetStatus"></div>
    <p class="story" id="sheetStory"></p>
    <div class="sheet-links">
      <a id="archiveLink" href="#" target="_blank" rel="noopener">查看北市圖館藏</a>
      <a id="videoLink" href="#" style="display:none">看動圖</a>
    </div>
  </div>
</section>

<div class="dialog" id="dialog"><div class="dialog-card"><h4 id="dialogTitle">提示</h4><p id="dialogText"></p><div class="dialog-actions"><button class="no" id="dialogCancel">取消</button><button class="yes" id="dialogConfirm">確認</button></div></div></div>
<div class="passport-overlay" id="passportOverlay"><div class="passport-card"><div class="passport-head"><div><h4>城西集章簿</h4><p id="passportSummary">已集 0／8 景 · 0 分</p></div><button class="close-btn" id="closePassport">×</button></div><div class="passport-grid" id="passportGrid"></div></div></div>
<div class="video-overlay" id="videoOverlay"><div class="video-card"><button class="video-close" id="videoClose">×</button><video id="videoPlayer" controls playsinline></video></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<script>
(() => {
  const sites = [
    {id:'new-st-market',name:'新起街市場',era:'1920年代',year:1920,lat:25.04163,lng:121.50720,radius:70,now:'今・西門紅樓／成都路一帶',img:'images/new-start-market.jpg',thumb:'images/thumbs/new-start-market.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6506&ctNode=404&mp=3',story:'西門紅樓前身是新起街市場。從市場、劇場到今日的文化地標，這裡一直是城西最熱鬧的場景之一。'},
    {id:'ximending-street',name:'西門町街景',era:'1930年代',year:1930,lat:25.04258,lng:121.50798,radius:75,now:'今・西門町徒步區一帶',img:'images/ximending-street.jpg',thumb:'images/thumbs/ximending-street.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=588&ctNode=404&mp=3',story:'西門町在 1930 年代已經是時髦街區。比對老照片與今日街景，可以感受到商業中心如何不斷轉變又持續熱鬧。'},
    {id:'nishi-honganji',name:'西本願寺本堂',era:'1930年代',year:1930,lat:25.03998,lng:121.50589,radius:80,now:'今・西本願寺廣場',img:'images/nishi-honganji.jpg',thumb:'images/thumbs/nishi-honganji.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6617&ctNode=404&mp=3',story:'昔日西本願寺是城西極具代表性的宗教建築。雖然本堂已不復存在，仍能透過照片想像當年寺院的規模。'},
    {id:'new-world-cinema',name:'新世界大戲院',era:'1950年代',year:1950,lat:25.04113,lng:121.50708,radius:75,now:'今・西寧南路與成都路一帶',img:'images/new-world-cinema.jpg',thumb:'images/thumbs/new-world-cinema.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6507&ctNode=404&mp=3',story:'看電影曾是西門町最重要的娛樂活動之一。到現場尋找老戲院位置，會更容易理解城西的娛樂文化。'},
    {id:'longshan-temple',name:'艋舺龍山寺',era:'1950年代',year:1950,lat:25.03732,lng:121.49987,radius:90,now:'今・龍山寺前廣場',img:null,thumb:null,archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6624&ctNode=404&mp=3',story:'龍山寺一直是萬華重要的信仰與生活核心。當老照片與現場街景重疊時，你會看到不同年代的城市節奏。'},
    {id:'zhonghua-market',name:'中華商場',era:'1960年代',year:1960,lat:25.04408,lng:121.50603,radius:90,now:'今・中華路一段',img:'images/zhonghua-market.jpg',thumb:'images/thumbs/zhonghua-market.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6494&ctNode=404&mp=3',story:'過去中華商場沿著中華路綿延排列，如今建築已不在，但它仍是許多人記憶中的重要地標。'},
    {id:'zhongshan-hall',name:'中山堂',era:'1970年',year:1970,lat:25.04348,lng:121.50957,radius:85,now:'今・延平南路98號',img:'images/zhongshan-hall.jpg',thumb:'images/thumbs/zhongshan-hall.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=4007&ctNode=404&mp=3',story:'中山堂見證了臺北公共生活的變化。從 1970 年的照片，再看看今日同一棟建築，能感受到時代的推移。'},
    {id:'today-department',name:'今日百貨',era:'1986年',year:1986,lat:25.04368,lng:121.50537,radius:80,now:'今・峨眉街52號一帶',img:'images/today-department.jpg',thumb:'images/thumbs/today-department.webp',video:'videos/today-department.mp4',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=7230&ctNode=404&mp=3',story:'今日百貨是許多西門町逛街記憶的一部分。抵達現場後，你也可以播放動圖，看看那段街區記憶被重新喚醒。'}
  ];

  const $ = id => document.getElementById(id);
  const passportBtn = $('passportBtn'); const passportOverlay = $('passportOverlay');
  const yearRow = $('yearRow'); const sheet = $('sheet'); const sheetBackdrop = $('sheetBackdrop');
  const sheetEra = $('sheetEra'), sheetTitle = $('sheetTitle'), sheetNow = $('sheetNow'), sheetStory = $('sheetStory'), sheetStatus = $('sheetStatus'), photoBox = $('photoBox'), photoCaption = $('photoCaption');
  const archiveLink = $('archiveLink'), videoLink = $('videoLink'), navBtn = $('navBtn'), checkBtn = $('checkBtn');
  const locateBtn = $('locateBtn');
  let selected = null; let userPos = null; let dialogAction = null;
  const saved = JSON.parse(localStorage.getItem('cx_v11_done') || '[]');
  const done = new Set(saved);

  const years = [1920, 1930, 1950, 1960, 1970];
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'year';
    btn.innerHTML = `<span class="dot"></span><span>${y}</span>`;
    btn.addEventListener('click', () => {
      const idx = sites.findIndex(s => s.year === y);
      if (idx >= 0) selectSite(idx, true);
    });
    yearRow.appendChild(btn);
  });

  function updateYear(){ [...yearRow.children].forEach((b,i) => b.classList.toggle('active', selected !== null && years[i] === sites[selected].year)); }
  function updatePassportSummary(){
    passportBtn.innerHTML = `<span class="label">集章簿　${done.size}／${sites.length}</span><span class="score">${done.size * 100} 分</span>`;
    $('passportSummary').textContent = `已集 ${done.size}／${sites.length} 景 · ${done.size*100} 分`;
    $('passportGrid').innerHTML = sites.map((s,i)=>`<div class="stamp ${done.has(s.id)?'done':''}"><small>NO. ${String(i+1).padStart(2,'0')} · ${s.era}</small><strong>${s.name}</strong><em>${done.has(s.id)?'已尋回 ＋100':'尚未尋回'}</em></div>`).join('');
  }

  const map = L.map('map', {zoomControl:true, preferCanvas:true, zoomSnap:1, inertia:true}).setView([25.0418, 121.5057], 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap contributors'}).addTo(map);
  const markerLayer = L.layerGroup().addTo(map);
  let userMarker = null;

  function markerIcon(site, index){
    const hasImg = !!site.thumb;
    const active = selected === index ? ' active' : '';
    const check = done.has(site.id) ? '<span class="check">✓</span>' : '';
    return L.divIcon({
      className:'',
      iconSize:[46,60],
      iconAnchor:[23,54],
      html:`<div class="photo-pin${active}"><div class="ring ${hasImg ? '' : 'fallback'}">${hasImg ? `<img src="${site.thumb}" alt="">` : '影'}</div>${check}</div>`
    });
  }

  function renderMarkers(){
    markerLayer.clearLayers();
    sites.forEach((site, index) => {
      const marker = L.marker([site.lat, site.lng], {icon: markerIcon(site,index), title: site.name, zIndexOffset: selected === index ? 1000 : 0});
      marker.on('click', () => selectSite(index, false));
      markerLayer.addLayer(marker);
    });
  }

  function distance(a,b){
    const rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const p = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
    return 6371000 * 2 * Math.atan2(Math.sqrt(p), Math.sqrt(1-p));
  }

  function openSheet(){ sheet.classList.add('open'); sheetBackdrop.classList.add('open'); }
  function closeSheet(){ sheet.classList.remove('open'); sheetBackdrop.classList.remove('open'); }
  $('closeSheet').onclick = closeSheet; sheetBackdrop.onclick = closeSheet;

  function statusText(site){
    if (done.has(site.id)) return `✓ 已找到這個地點，集章簿已蓋章並獲得 100 分。`;
    if (!userPos) return `抵達後按「到點打卡」即可確認；看故事與照片不需要先啟用 GPS。`;
    const d = distance(userPos, site);
    const mins = Math.max(1, Math.ceil(d/80));
    return `目前距離約 ${d >= 1000 ? (d/1000).toFixed(1)+' 公里' : Math.round(d)+' 公尺'}，步行約 ${mins} 分鐘。`;
  }

  function selectSite(index, fly){
    selected = index;
    const site = sites[index];
    sheetEra.textContent = `${site.era} · 歷史片段 ${String(index+1).padStart(2,'0')} / 08`;
    sheetTitle.textContent = site.name;
    sheetNow.textContent = site.now;
    sheetStory.textContent = site.story;
    sheetStatus.textContent = statusText(site);
    archiveLink.href = site.archive;
    videoLink.style.display = (site.video && done.has(site.id)) ? 'inline-block' : 'none';
    checkBtn.textContent = done.has(site.id) ? '✓ 已找到' : '到點打卡';
    checkBtn.disabled = done.has(site.id);
    photoBox.innerHTML = '';
    if (site.img) {
      const img = document.createElement('img'); img.src = site.img; img.alt = site.name; photoBox.appendChild(img);
      photoCaption.textContent = '臺北市立圖書館數位典藏';
    } else {
      photoBox.innerHTML = '<div style="padding:56px 14px;text-align:center;color:#7b6b5b;font-size:16px;font-weight:700">館藏照片待補</div>';
      photoCaption.textContent = '尚未提供館藏原圖';
    }
    if (fly) map.flyTo([site.lat, site.lng], 16, {duration:.5});
    updateYear(); renderMarkers(); openSheet();
  }

  function showDialog(title, text, yes='確認', no='取消', onYes=null){
    $('dialogTitle').textContent = title; $('dialogText').textContent = text; $('dialogConfirm').textContent = yes; $('dialogCancel').textContent = no; dialogAction = onYes; $('dialog').classList.add('open');
  }
  function closeDialog(){ $('dialog').classList.remove('open'); dialogAction = null; }
  $('dialogCancel').onclick = closeDialog;
  $('dialogConfirm').onclick = () => { const fn = dialogAction; closeDialog(); if (fn) fn(); };

  function updateUser(pos){
    userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy};
    if (!userMarker) userMarker = L.circleMarker([userPos.lat, userPos.lng], {radius:8, color:'#fff', weight:3, fillColor:'#d9413b', fillOpacity:1}).addTo(map);
    userMarker.setLatLng([userPos.lat, userPos.lng]);
    if (selected !== null) sheetStatus.textContent = statusText(sites[selected]);
  }

  function requestLocation(after){
    if (!navigator.geolocation) { showDialog('無法定位', '此裝置不支援定位功能。', '知道了', '關閉'); return; }
    if (!window.isSecureContext) { showDialog('需要安全網址', '請以 HTTPS 網址開啟網站，才能使用手機 GPS。', '知道了', '關閉'); return; }
    locateBtn.textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(pos => { locateBtn.textContent = '我的位置'; updateUser(pos); if (after) after(pos); }, err => {
      locateBtn.textContent = '啟用我的位置';
      const reason = err.code === 1 ? '你拒絕了位置權限，請在瀏覽器網站設定重新允許。' : err.code === 2 ? '目前抓不到 GPS，請移到較開闊的位置再試。' : '定位逾時，請再試一次。';
      showDialog('定位未成功', reason, '知道了', '關閉');
    }, {enableHighAccuracy:true, maximumAge:3000, timeout:16000});
  }

  function stampSite(site){
    if (done.has(site.id)) return;
    done.add(site.id); localStorage.setItem('cx_v11_done', JSON.stringify([...done]));
    updatePassportSummary(); renderMarkers(); sheetStatus.textContent = statusText(site); checkBtn.textContent = '✓ 已找到'; checkBtn.disabled = true; videoLink.style.display = site.video ? 'inline-block' : 'none';
    showDialog('到囉！', `你已成功找到「${site.name}」，已加入集章簿並獲得 100 分。`, '查看集章簿', '繼續探索', () => passportOverlay.classList.add('open'));
  }

  function verifyCheckin(pos){
    if (selected === null) return;
    const site = sites[selected];
    const here = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    const d = distance(here, site);
    if (d > site.radius) { showDialog('還沒到喔', `你目前距離「${site.name}」約 ${Math.round(d)} 公尺。抵達附近後再按一次「到點打卡」。`, '繼續尋找', '關閉'); return; }
    stampSite(site);
  }

  locateBtn.onclick = () => requestLocation(pos => map.panTo([pos.coords.latitude, pos.coords.longitude]));
  navBtn.onclick = () => { if (selected === null) return; const s = sites[selected]; window.open(`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking`, '_blank', 'noopener'); };
  checkBtn.onclick = () => {
    if (selected === null || done.has(sites[selected].id)) return;
    showDialog('啟用 GPS 打卡？', '我們只會在你按下打卡時取得一次位置，用來確認你是否抵達這個歷史地點。', '啟用並打卡', '暫不啟用', () => requestLocation(verifyCheckin));
  };
  passportBtn.onclick = () => passportOverlay.classList.add('open');
  $('closePassport').onclick = () => passportOverlay.classList.remove('open');
  passportOverlay.addEventListener('click', e => { if (e.target === passportOverlay) passportOverlay.classList.remove('open'); });
  videoLink.onclick = e => { e.preventDefault(); if (selected === null) return; const site = sites[selected]; if (!site.video || !done.has(site.id)) return; $('videoPlayer').src = site.video; $('videoOverlay').classList.add('open'); };
  $('videoClose').onclick = () => { $('videoPlayer').pause(); $('videoOverlay').classList.remove('open'); };

  updatePassportSummary(); renderMarkers(); updateYear();
})();
</script>
</body>
</html>
